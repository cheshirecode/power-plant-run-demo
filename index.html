<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Power Plant Run</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-shell is-gated" data-style="steampunk">
      <header class="topbar">
        <div>
          <h1>Power Plant Run</h1>
          <p id="run-status">Approaching the plant</p>
        </div>

        <div class="controls" aria-label="Game controls">
          <div class="session-controls" aria-label="Session controls">
            <span class="session-status" id="auth-status">Signed out</span>
            <button class="control-button" type="button" id="login-button">GitHub</button>
            <button class="control-button is-hidden" type="button" id="logout-button">Logout</button>
          </div>

          <div class="room-controls" aria-label="Room controls">
            <button class="control-button" type="button" id="create-room-button">Create</button>
            <input class="room-input" id="room-code-input" type="text" maxlength="40" autocomplete="off" aria-label="Room code" />
            <button class="control-button" type="button" id="join-room-button">Join</button>
            <button class="control-button" type="button" id="ready-button" aria-pressed="false">Ready</button>
            <button class="control-button" type="button" id="copy-room-button">Copy</button>
            <span class="session-status" id="room-status">Solo</span>
          </div>

          <div class="style-switcher" aria-label="Graphics style">
            <button class="style-button is-active" type="button" data-style="steampunk" aria-pressed="true">
              <span class="swatch swatch-steampunk" aria-hidden="true"></span>
              Steampunk
            </button>
            <button class="style-button" type="button" data-style="cyberpunk" aria-pressed="false">
              <span class="swatch swatch-cyberpunk" aria-hidden="true"></span>
              Cyberpunk
            </button>
            <button class="style-button" type="button" data-style="futuristic" aria-pressed="false">
              <span class="swatch swatch-futuristic" aria-hidden="true"></span>
              Futuristic
            </button>
          </div>

          <button class="replay-button" type="button" id="replay-button" aria-label="Replay run">
            Replay
          </button>
          <button class="replay-button" type="button" id="audio-button" aria-pressed="false">
            Sound Off
          </button>
        </div>
      </header>

      <section class="stage-wrap" aria-label="Soldier entering the power plant demo">
        <canvas id="game-canvas" width="384" height="216"></canvas>
        <div class="start-gate" id="start-gate">
          <div class="start-panel">
            <h2>Power Plant Run</h2>
            <button class="start-button" type="button" id="start-button">Start</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
